<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GladiatorGuru</title>
    <script>
      // GitHub Pages 404 handler - redirect to index.html with hash routing
      // Preserve the current path and query parameters
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;

      // If we're at /auth/discord/callback, redirect to hash route
      if (path === '/auth/discord/callback') {
        window.location.replace('/#/auth/discord/callback' + search);
      } else {
        // For other 404s, redirect to home with hash
        window.location.replace('/#' + path + search + hash);
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
